<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welkom · Stedelijk Lyceum Rotterdam</title>
<meta name="description" content="Welkom op het Stedelijk Lyceum Rotterdam. Vul je naam in en ontdek de nieuwste school van de stad.">
<link rel="stylesheet" href="assets/site.css?v=46">
<style>
  .wk{min-height:100svh;min-height:100dvh;background:var(--bone,#f4f3f0);color:var(--ink,#111);
      display:flex;flex-direction:column;overflow:hidden;position:relative}
  .wk__deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .wk__deco span{position:absolute;right:-13vw;top:-14vw;width:44vw;height:44vw;max-width:640px;max-height:640px;
      background:var(--accent,#ffe500);border-radius:50%;opacity:.82}
  .wk__deco i{position:absolute;left:-8vw;bottom:-16vw;width:34vw;height:34vw;max-width:520px;max-height:520px;
      border:2px solid rgba(17,17,17,.08);border-radius:50%}
  .wk__top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;
      padding:clamp(22px,4vw,40px) clamp(20px,5vw,90px)}
  .wk__dot{width:16px;height:16px;background:var(--accent,#ffe500);flex:none}
  .wk__brand{font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.02em}
  .wk__brand b{color:#111}
  .wk__in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;
      max-width:1000px;width:100%;margin:0 auto;box-sizing:border-box;padding:0 clamp(20px,5vw,90px) clamp(40px,6vw,90px)}
  .wk__eyebrow{font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.16em;color:#8a8884;margin-bottom:clamp(18px,2.4vw,30px)}
  .wk__h{font-weight:800;text-transform:uppercase;line-height:.94;letter-spacing:-.025em;margin:0;
      font-size:clamp(38px,6.2vw,82px);max-width:13ch}
  .wk__mk{-webkit-box-decoration-break:clone;box-decoration-break:clone;
      box-shadow:inset 0 -.13em 0 var(--accent,#ffe500)}
  .wk__lead{font-weight:300;font-size:clamp(16px,1.8vw,20px);line-height:1.5;color:#4a4844;
      max-width:46ch;margin:clamp(22px,3vw,34px) 0 0}
  .wk__form{margin-top:clamp(30px,4vw,48px);max-width:560px}
  .wk__label{display:block;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.14em;color:#8a8884;margin-bottom:12px}
  .wk__row{display:flex;align-items:stretch;gap:14px;flex-wrap:wrap}
  .wk__input{flex:1;min-width:220px;font-family:inherit;font-weight:600;font-size:clamp(20px,2.4vw,28px);
      color:#111;background:transparent;border:0;border-bottom:3px solid #111;padding:10px 2px;outline:none}
  .wk__input::placeholder{color:#bdbbb6;font-weight:400}
  .wk__input:focus{border-color:var(--accent,#ffe500)}
  .wk__btn{position:relative;overflow:hidden;font-family:inherit;cursor:pointer;border:0;
      font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.05em;
      background:#111;color:#fff;padding:0 30px;min-height:60px;display:inline-flex;align-items:center;gap:12px;transition:color .3s}
  .wk__btn>span,.wk__btn>b{position:relative;z-index:1}
  .wk__btn::before{content:'';position:absolute;inset:0;background:var(--accent,#ffe500);
      transform:translateY(101%);transition:transform .34s cubic-bezier(.19,1,.22,1);z-index:0}
  .wk__btn:hover{color:#111}
  .wk__btn:hover::before{transform:translateY(0)}
  .wk__skip{margin-top:22px;background:none;border:0;font-family:inherit;cursor:pointer;
      font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:#8a8884;padding:8px 0;transition:color .2s}
  .wk__skip:hover{color:#111}
  .wk__foot{position:relative;z-index:2;padding:clamp(18px,3vw,30px) clamp(20px,5vw,90px);
      font-size:12px;color:#9c9a95}
  .wk-anim .wk__eyebrow,.wk-anim .wk__h,.wk-anim .wk__lead,.wk-anim .wk__form,.wk-anim .wk__skip{
      opacity:0;transform:translateY(22px);animation:wkUp .8s cubic-bezier(.19,1,.22,1) forwards}
  .wk-anim .wk__h{animation-delay:.06s}
  .wk-anim .wk__lead{animation-delay:.14s}
  .wk-anim .wk__form{animation-delay:.22s}
  .wk-anim .wk__skip{animation-delay:.3s}
  @keyframes wkUp{to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.wk-anim *{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body class="wk wk-anim">
  <div class="wk__deco" aria-hidden="true"><span></span><i></i></div>

  <header class="wk__top">
    <span class="wk__dot"></span>
    <span class="wk__brand">Stedelijk <b>Ly</b>ceum Rotterdam</span>
  </header>

  <main class="wk__in">
    <div class="wk__eyebrow">Opent in 2027 · Kop van Zuid, Rotterdam</div>
    <h1 class="wk__h">Welkom op het<br><span class="wk__mk">Stedelijk Lyceum Rotterdam</span></h1>
    <p class="wk__lead">Leuk dat je er bent. Vul hieronder je naam in, dan maken we jouw bezoek aan onze school een beetje persoonlijker.</p>

    <form class="wk__form" id="wkForm" autocomplete="on">
      <label class="wk__label" for="wkNaam">Jouw naam</label>
      <div class="wk__row">
        <input class="wk__input" id="wkNaam" name="naam" type="text" placeholder="Bijv. Amir" autocomplete="given-name" maxlength="40">
        <button class="wk__btn" type="submit"><span>Ga verder</span><b aria-hidden="true">→</b></button>
      </div>
    </form>
    <button class="wk__skip" id="wkSkip" type="button">Liever niet, ga direct naar de site</button>
  </main>

  <footer class="wk__foot">De nieuwste school van de stad · Opent in 2027</footer>

<script>
(function(){
  var form = document.getElementById('wkForm');
  var input = document.getElementById('wkNaam');
  var skip = document.getElementById('wkSkip');

  function titel(s){
    s = (s || '').trim().replace(/\s+/g, ' ').slice(0, 40);
    return s.replace(/(^|[\s'-])([a-zà-ÿ])/g, function(m, p, c){ return p + c.toUpperCase(); });
  }
  function go(naam){
    try {
      if (naam) localStorage.setItem('slrNaam', naam);
      localStorage.setItem('slrSeen', '1');
    } catch (e) {}
    var w = window.innerWidth || document.documentElement.clientWidth || 0;
    location.replace(w > 0 && w <= 820 ? 'app.html' : 'index.html');
  }
  form.addEventListener('submit', function(e){ e.preventDefault(); go(titel(input.value)); });
  skip.addEventListener('click', function(){ go(''); });
  try { input.focus(); } catch (e) {}
})();
</script>
</body>
</html>
