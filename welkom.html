<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welkom · Stedelijk Lyceum Rotterdam</title>
<meta name="description" content="Welkom op het Stedelijk Lyceum Rotterdam. Vul je naam in en ontdek de nieuwste school van de stad.">
<link rel="stylesheet" href="assets/site.css?v=47">
<style>
  .wk{min-height:100svh;min-height:100dvh;background:var(--accent,#ffe500);color:#111;
      display:flex;flex-direction:column;overflow:hidden}
  .wk__top{display:flex;justify-content:flex-end;align-items:center;
      padding:clamp(22px,4vw,42px) clamp(20px,5vw,90px)}
  .wk__brand{display:inline-flex;align-items:center;gap:11px;
      font-weight:800;text-transform:uppercase;font-size:clamp(14px,1.5vw,17px);letter-spacing:.02em;color:#111}
  .wk__brand b{color:#111}
  .wk__dot{width:14px;height:14px;background:#111;flex:none}
  .wk__in{flex:1;display:flex;flex-direction:column;justify-content:center;
      max-width:1120px;width:100%;margin:0 auto;box-sizing:border-box;
      padding:0 clamp(20px,5vw,90px) clamp(48px,7vw,96px)}
  .wk__eyebrow{font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.16em;
      color:rgba(17,17,17,.6);margin-bottom:clamp(18px,2.4vw,30px)}
  .wk__h{font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:-.025em;margin:0;
      color:#111;font-size:clamp(40px,6.6vw,90px);max-width:14ch}
  .wk__lead{font-weight:400;font-size:clamp(16px,1.8vw,20px);line-height:1.5;color:#1a1815;
      max-width:46ch;margin:clamp(22px,3vw,34px) 0 0}
  .wk__form{margin-top:clamp(30px,4vw,48px);max-width:560px}
  .wk__label{display:block;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.14em;
      color:rgba(17,17,17,.6);margin-bottom:12px}
  .wk__row{display:flex;align-items:stretch;gap:14px;flex-wrap:wrap}
  .wk__input{flex:1;min-width:220px;font-family:inherit;font-weight:600;font-size:clamp(20px,2.4vw,28px);
      color:#111;background:transparent;border:0;border-bottom:3px solid #111;padding:10px 2px;outline:none}
  .wk__input::placeholder{color:rgba(17,17,17,.38);font-weight:400}
  .wk__input:focus{border-bottom-width:4px}
  .wk__btn{font-family:inherit;cursor:pointer;border:0;
      font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.05em;
      background:#111;color:#fff;padding:0 32px;min-height:62px;display:inline-flex;align-items:center;gap:12px;
      transition:transform .16s cubic-bezier(.19,1,.22,1),background .2s}
  .wk__btn>b{font-weight:700}
  .wk__btn:hover{background:#000;transform:translateY(-2px)}
  .wk__skip{margin-top:22px;background:none;border:0;font-family:inherit;cursor:pointer;
      font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em;
      color:rgba(17,17,17,.55);padding:8px 0;transition:color .2s}
  .wk__skip:hover{color:#111}
  .wk__foot{padding:clamp(18px,3vw,30px) clamp(20px,5vw,90px);
      font-size:12px;font-weight:600;letter-spacing:.02em;color:rgba(17,17,17,.5)}
  .wk-anim .wk__eyebrow,.wk-anim .wk__h,.wk-anim .wk__lead,.wk-anim .wk__form,.wk-anim .wk__skip{
      opacity:0;transform:translateY(20px);animation:wkUp .8s cubic-bezier(.19,1,.22,1) forwards}
  .wk-anim .wk__h{animation-delay:.05s}
  .wk-anim .wk__lead{animation-delay:.12s}
  .wk-anim .wk__form{animation-delay:.2s}
  .wk-anim .wk__skip{animation-delay:.28s}
  @keyframes wkUp{to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.wk-anim *{animation:none!important;opacity:1!important;transform:none!important}}

  /* ===== mobile-first laag (desktop blijft intact) ===== */
  @media(max-width:640px){
    .wk__top{justify-content:flex-start;padding:22px 22px 0}
    .wk__brand{font-size:12px;gap:9px}
    .wk__dot{width:12px;height:12px}
    .wk__in{flex:1;justify-content:flex-start;padding:64px 22px 28px;margin:0}
    .wk__eyebrow{display:none}
    .wk__h{font-size:clamp(36px,11.5vw,56px);line-height:.95;max-width:none}
    .wk__lead{font-size:16px;line-height:1.5;margin-top:20px;max-width:34ch}
    .wk__form{margin-top:auto;max-width:none;padding-top:34px}
    .wk__label{margin-bottom:10px}
    .wk__row{flex-direction:column;gap:18px;align-items:stretch}
    .wk__input{width:100%;min-width:0;box-sizing:border-box;font-size:22px;padding:12px 2px}
    .wk__btn{width:100%;justify-content:center;min-height:62px;padding:0 24px}
    .wk__skip{align-self:stretch;text-align:center;margin-top:20px}
    .wk__foot{display:none}
  }
</style>
</head>
<body class="wk wk-anim">
  <header class="wk__top">
    <span class="wk__brand"><span class="wk__dot"></span><span>Stedelijk <b>Ly</b>ceum Rotterdam</span></span>
  </header>

  <main class="wk__in">
    <div class="wk__eyebrow">Opent in 2027 · Kop van Zuid, Rotterdam</div>
    <h1 class="wk__h">Welkom op het Stedelijk Lyceum Rotterdam</h1>
    <p class="wk__lead">Leuk dat je er bent. Vul hieronder je naam in, dan maken we jouw bezoek aan onze school een beetje persoonlijker.</p>

    <form class="wk__form" id="wkForm" autocomplete="on">
      <label class="wk__label" for="wkNaam">Jouw naam</label>
      <div class="wk__row">
        <input class="wk__input" id="wkNaam" name="naam" type="text" placeholder="Bijv. Amir" autocomplete="given-name" maxlength="40">
        <button class="wk__btn" type="submit"><span>Ga verder</span><b aria-hidden="true">→</b></button>
      </div>
    </form>
    <button class="wk__skip" id="wkSkip" type="button">Liever niet, ga direct naar de site</button>
  </main>

  <footer class="wk__foot">De nieuwste school van de stad · Opent in 2027</footer>

<script>
(function(){
  var form = document.getElementById('wkForm');
  var input = document.getElementById('wkNaam');
  var skip = document.getElementById('wkSkip');

  function titel(s){
    s = (s || '').trim().replace(/\s+/g, ' ').slice(0, 40);
    return s.replace(/(^|[\s'-])([a-zà-ÿ])/g, function(m, p, c){ return p + c.toUpperCase(); });
  }
  function go(naam){
    try {
      if (naam) localStorage.setItem('slrNaam', naam);
      localStorage.setItem('slrSeen', '1');
    } catch (e) {}
    var w = window.innerWidth || document.documentElement.clientWidth || 0;
    location.replace(w > 0 && w <= 820 ? 'app.html' : 'index.html');
  }
  form.addEventListener('submit', function(e){ e.preventDefault(); go(titel(input.value)); });
  skip.addEventListener('click', function(){ go(''); });
  try { input.focus(); } catch (e) {}
})();
</script>
</body>
</html>
